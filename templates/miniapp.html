<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>🎲 قمارخانه زر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#07070c;--bg2:#0e0e17;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);--text:#f4f4f7;--muted:#9a9ab0;--gold:#f5c451;--gold2:#d99a1e;
  --red:#e11d48;--red2:#9f1239;--green:#10b981;--green2:#047857;--blue:#38bdf8;--radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100%;overscroll-behavior:none}
body{background:
  radial-gradient(1200px 500px at 100% -10%,rgba(225,29,72,.18),transparent 60%),
  radial-gradient(900px 500px at -10% 0%,rgba(245,196,81,.12),transparent 55%),var(--bg);background-attachment:fixed}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:inherit}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(24px + var(--safe-b))}

/* ── top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px 14px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 70%,transparent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;
  background:linear-gradient(135deg,var(--gold),var(--red));color:#160b00;box-shadow:0 6px 20px rgba(225,29,72,.35)}
.who-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.who-lvl{font-size:11px;color:var(--gold);background:rgba(245,196,81,.12);border:1px solid rgba(245,196,81,.25);padding:1px 8px;border-radius:99px;display:inline-block;margin-top:2px}
.bal{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(245,196,81,.05));
  border:1px solid rgba(245,196,81,.35);font-weight:800;color:var(--gold);font-size:15px;white-space:nowrap}
.bal .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 45%,var(--gold2));box-shadow:0 0 12px rgba(245,196,81,.6)}
.bal.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12)}}

/* ── screens ── */
.screen{display:none}
.screen.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── hero ── */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:16px;
  background:linear-gradient(135deg,#1a0a10 0%,#2a0d18 45%,#1b1408 100%);border:1px solid rgba(245,196,81,.18)}
.hero::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(245,196,81,.12),transparent 30%);animation:spin 10s linear infinite}
.hero>*{position:relative}
.hero h1{margin:0 0 4px;font-size:21px;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#cfc6d6;font-size:13px;line-height:1.9}
.hero .big{margin-top:14px;display:flex;align-items:flex-end;gap:8px}
.hero .big b{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:-.5px}
.hero .big span{color:var(--muted);font-size:13px;padding-bottom:6px}
.hero .suits{position:absolute;left:14px;top:12px;font-size:28px;opacity:.18;letter-spacing:4px}
@keyframes spin{to{transform:rotate(360deg)}}

.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;margin-bottom:14px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);font-size:13px}
.resume button{background:var(--green);color:#03140e;font-weight:800;padding:8px 14px;border-radius:12px}

/* ── tabs ── */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.tab{padding:11px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:.25s}
.tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 18px rgba(225,29,72,.35)}

/* ── game grid ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{position:relative;text-align:right;padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);overflow:hidden;
  transition:transform .2s,border-color .2s;min-height:150px;display:flex;flex-direction:column}
.gcard:active{transform:scale(.97)}
.gcard::after{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;background:var(--g1);opacity:.18;filter:blur(30px)}
.gicon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 22px -6px var(--g1)}
.gname{font-weight:800;font-size:15px;margin-bottom:4px}
.gdesc{font-size:11.5px;color:var(--muted);line-height:1.8;flex:1}
.gmeta{margin-top:8px;font-size:11px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.badge2p{position:absolute;top:12px;left:12px;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(56,189,248,.14);color:var(--blue);border:1px solid rgba(56,189,248,.3)}

/* ── common ui ── */
.subhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.subhead h2{margin:0;font-size:18px;font-weight:800;flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,#ffd978,var(--gold2));color:#1d1200;box-shadow:0 10px 26px -8px rgba(245,196,81,.7)}
.btn-red{background:linear-gradient(135deg,#fb3b65,var(--red2));color:#fff;box-shadow:0 10px 26px -8px rgba(225,29,72,.7)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#02140d;box-shadow:0 10px 26px -8px rgba(16,185,129,.7)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.label{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}
.betrow{display:flex;gap:8px;align-items:center}
.betrow input{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:800;color:var(--gold);background:rgba(0,0,0,.35);border:1px solid rgba(245,196,81,.3);
  border-radius:14px;padding:11px;outline:none;direction:ltr}
.betrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,81,.15)}
.betrow button{width:52px;height:50px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chip.on,.chip:active{background:rgba(245,196,81,.18);border-color:rgba(245,196,81,.5);color:var(--gold)}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.stage{position:relative;border-radius:22px;padding:18px;margin-bottom:12px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.06),transparent 60%),linear-gradient(180deg,#12121d,#0b0b13);border:1px solid var(--line);overflow:hidden}
.result-pill{margin-top:12px;padding:8px 18px;border-radius:99px;font-weight:800;font-size:15px;animation:pop .4s}
.result-pill.win{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.4)}
.result-pill.lose{background:rgba(225,29,72,.13);color:#fb7185;border:1px solid rgba(225,29,72,.4)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.stats{display:flex;justify-content:space-around;gap:8px;width:100%;margin-top:12px}
.stat{text-align:center;flex:1;padding:8px;border-radius:12px;background:rgba(255,255,255,.04)}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:15px;color:var(--gold)}

/* ── wheel ── */
.wheel-wrap{position:relative;width:min(78vw,300px);aspect-ratio:1}
.wheel-wrap svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.1,1);filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:26px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:2}
.wheel-hub{position:absolute;inset:39%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 50%,var(--gold2));display:grid;place-items:center;
  font-weight:900;color:#2a1800;font-size:13px;box-shadow:0 0 0 4px #1a1209,0 0 24px rgba(245,196,81,.5)}

/* ── crash ── */
.crash-num{font-size:58px;font-weight:900;letter-spacing:-1px;direction:ltr;transition:color .2s}
.crash-num.passed{color:#34d399;text-shadow:0 0 30px rgba(16,185,129,.5)}
.crash-num.dead{color:#fb7185;text-shadow:0 0 30px rgba(225,29,72,.5)}
.rocket{font-size:46px;transition:transform .1s linear}
.rocket.fly{animation:shake .15s infinite}
@keyframes shake{50%{translate:1px -1px}}
.crash-sky{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 20%,#fff7,transparent);opacity:.6}
.target-tag{font-size:13px;color:var(--muted);margin-top:4px}

/* ── coin ── */
.coin3d{width:150px;height:150px;position:relative;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:62px;backface-visibility:hidden;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 45%,var(--gold2) 85%);box-shadow:inset 0 0 0 8px rgba(120,70,0,.35),0 14px 40px rgba(0,0,0,.6)}
.face.back{transform:rotateY(180deg)}
.coin-scene{perspective:800px;margin:10px 0}

/* ── mines ── */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.mcell{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#232336,#191926);border:1px solid rgba(255,255,255,.07);font-size:24px;display:grid;place-items:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);transition:transform .15s}
.mcell:not(:disabled):active{transform:scale(.92)}
.mcell.gem{background:linear-gradient(180deg,#0f3d30,#0a2a21);border-color:rgba(16,185,129,.5);animation:pop .3s}
.mcell.mine{background:linear-gradient(180deg,#3d0f1a,#2a0a12);border-color:rgba(225,29,72,.5)}
.mcell.boom{background:var(--red);animation:pop .3s}
.mcell.dim{opacity:.5}

/* ── cards ── */
.card{width:54px;height:78px;border-radius:9px;background:linear-gradient(180deg,#fff,#eceff4);color:#111;position:relative;flex:none;
  box-shadow:0 6px 16px rgba(0,0,0,.45);font-weight:800;display:inline-block;direction:ltr;transition:transform .2s}
.card.red{color:#d10f3a}
.card .cr{position:absolute;top:4px;left:6px;font-size:15px;line-height:1}
.card .cs{position:absolute;top:20px;left:6px;font-size:12px;line-height:1}
.card .cc{position:absolute;bottom:6px;right:7px;font-size:26px;line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#7f1d1d 0 6px,#991b1b 6px 12px);border:3px solid #fde68a}
.card.lg{width:96px;height:138px;border-radius:14px}
.card.lg .cr{font-size:26px;top:8px;left:10px}.card.lg .cs{font-size:20px;top:36px;left:10px}.card.lg .cc{font-size:52px;bottom:10px;right:12px}
.card.sm{width:42px;height:60px}
.card.sm .cr{font-size:13px}.card.sm .cs{top:17px;font-size:10px}.card.sm .cc{font-size:19px}
.card.empty{background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.15);box-shadow:none}
.card.deal{animation:deal .35s ease}
@keyframes deal{from{transform:translateY(-20px) rotate(-8deg);opacity:0}}
.cards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
/* دست کارت‌ها چپ‌به‌راست تا عدد گوشه‌ی بالا-چپ هر کارت زیر کارت بعدی نرود */
.hand{display:flex;justify-content:center;padding:16px 4px 4px;overflow-x:auto;direction:ltr}
.hand .card{margin-left:-28px}
.hand .card:first-child{margin-left:0}
.hand .card .cr{font-size:17px;font-weight:900;top:4px;left:4px;letter-spacing:-1px}
.hand .card .cs{top:22px;left:5px;font-size:13px}
@media (min-width:430px){.hand .card{margin-left:-20px}}
.hand .card.playable{transform:translateY(-12px);box-shadow:0 0 0 2px var(--gold),0 10px 20px rgba(0,0,0,.5);cursor:pointer}
.hand .card.unplayable{filter:brightness(.55)}
.opp-hand .card{margin-left:-30px}
.opp-hand .card:first-child{margin-left:0}

/* ── game screen ── */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ghead h2{flex:1;margin:0;font-size:17px;font-weight:800}
.potpill{padding:7px 12px;border-radius:99px;background:rgba(245,196,81,.12);border:1px solid rgba(245,196,81,.3);color:var(--gold);font-weight:800;font-size:13px;white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px}
.pcard{display:flex;align-items:center;gap:8px;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0;transition:.25s}
.pcard.turn{border-color:rgba(245,196,81,.6);box-shadow:0 0 0 3px rgba(245,196,81,.12);background:rgba(245,196,81,.06)}
.pcard .avatar{width:34px;height:34px;font-size:14px;border-radius:11px}
.pcard.oppc .avatar{background:linear-gradient(135deg,#38bdf8,#6366f1);box-shadow:none}
.pcard b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pcard small{font-size:11px;color:var(--muted)}
.vs-mid{font-weight:900;color:var(--red);font-size:14px}
.timer{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:8px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:99px;transition:width .25s linear}
.timer.low i{background:var(--red)}
.gstatus{text-align:center;font-weight:700;font-size:14px;margin:6px 0 12px;min-height:22px}
.gstatus .t{color:var(--muted);font-weight:500;font-size:12px;margin-inline-start:6px}

.tttg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.tttc{aspect-ratio:1;border-radius:18px;background:linear-gradient(180deg,#1d1d2c,#141420);border:1px solid var(--line);font-size:48px;font-weight:900;display:grid;place-items:center}
.tttc.x{color:#fb7185}.tttc.o{color:var(--gold)}
.tttc.win{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.6)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px;border-radius:18px;background:linear-gradient(180deg,#1e3a8a,#172554);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);direction:ltr}
.c4col{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;border-radius:10px;padding:2px}
.c4col.can:active{background:rgba(255,255,255,.08)}
.c4cell{aspect-ratio:1;border-radius:50%;background:#0b1020;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.c4cell.p1{background:radial-gradient(circle at 35% 30%,#ff8fa3,#e11d48 60%,#9f1239)}
.c4cell.p2{background:radial-gradient(circle at 35% 30%,#fff1b8,#f5c451 60%,#b7791f)}
.c4cell.win{box-shadow:0 0 0 3px #fff,0 0 14px #fff}
.c4cell.last{animation:drop .35s ease}
@keyframes drop{from{transform:translateY(-120px)}}
.rpsb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rpsb button{aspect-ratio:1;border-radius:20px;font-size:44px;background:linear-gradient(180deg,#1f1f30,#151522);border:1px solid var(--line);transition:.2s}
.rpsb button.on{border-color:var(--gold);background:rgba(245,196,81,.14);transform:translateY(-4px)}
.score{display:flex;justify-content:center;align-items:center;gap:18px;font-size:34px;font-weight:900;margin:6px 0 12px}
.score small{display:block;font-size:11px;color:var(--muted);font-weight:500;text-align:center}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:20px}
.hrow span.r{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.r.win{background:rgba(16,185,129,.15);color:#34d399}.r.lose{background:rgba(225,29,72,.15);color:#fb7185}.r.draw{background:rgba(255,255,255,.08);color:var(--muted)}
.felt{border-radius:28px;padding:16px 12px;background:radial-gradient(ellipse at center,#176c43 0%,#0d4a2d 60%,#082e1c 100%);border:6px solid #3b2410;box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.5);text-align:center}
.felt .lbl{font-size:12px;color:#c8f0d8;margin:4px 0}
.felt .val{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.3);font-size:12px;color:#fde68a;font-weight:700;margin:4px 0}
.felt .pot{display:inline-flex;align-items:center;gap:6px;margin:10px 0;padding:6px 16px;border-radius:99px;background:rgba(0,0,0,.35);color:var(--gold);font-weight:900}
.log{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.9;text-align:center}
.trump{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:800;font-size:13px}
.trump b{font-size:20px}
.suitbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.suitbtns button{padding:14px 0;border-radius:16px;font-size:34px;background:#fff;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.suitbtns button.red{color:#d10f3a}
.table-mid{min-height:120px;display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;border-radius:20px;background:radial-gradient(ellipse,#14532d55,transparent 70%)}
.played{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.actions{display:grid;gap:8px;margin-top:12px}
.leave{margin-top:16px;width:100%;padding:11px;border-radius:14px;background:transparent;border:1px solid rgba(225,29,72,.35);color:#fb7185;font-weight:700;font-size:13px}

/* ── queue ── */
.radar{position:relative;width:210px;height:210px;margin:20px auto;border-radius:50%;
  background:radial-gradient(circle,rgba(225,29,72,.18) 0 30%,transparent 31%),radial-gradient(circle,transparent 0 55%,rgba(255,255,255,.06) 56% 57%,transparent 58%),radial-gradient(circle,transparent 0 80%,rgba(255,255,255,.06) 81% 82%,transparent 83%);border:1px solid rgba(255,255,255,.08)}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(245,196,81,.45),transparent 25%);animation:spin 2s linear infinite}
.radar .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.radar .c b{font-size:44px;font-weight:900;color:var(--gold);display:block;line-height:1}
.radar .c small{color:var(--muted);font-size:12px}
.qinfo{text-align:center;margin-bottom:18px}
.qinfo h3{margin:0 0 6px;font-size:20px}
.qinfo p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}

/* ── sheet / modal / toast ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;padding:18px 16px calc(18px + var(--safe-b));border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,#181824,#0e0e17);border-top:1px solid rgba(245,196,81,.25);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
.sheet .grip{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:-6px auto 14px}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head .gicon{margin:0}
.sheet-head h3{margin:0;font-size:18px}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal-box{width:100%;max-width:360px;border-radius:26px;padding:24px 20px;text-align:center;background:linear-gradient(180deg,#1c1c2a,#11111a);border:1px solid rgba(255,255,255,.1);
  transform:scale(.85);opacity:0;transition:.25s;pointer-events:auto;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.modal.show .modal-box{transform:none;opacity:1}
.modal:not(.show) .modal-box{pointer-events:none}
.modal-emoji{font-size:64px;line-height:1;margin-bottom:8px}
.modal-box h3{margin:0 0 6px;font-size:22px}
.modal-box p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.9}
.modal-amt{font-size:26px;font-weight:900;margin-bottom:16px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);z-index:80;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:700;
  background:#1e1e2d;border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.5);transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.err{border-color:rgba(225,29,72,.5);color:#fecdd3}
.toast.ok{border-color:rgba(16,185,129,.5);color:#bbf7d0}
.splash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.splash .logo{font-size:64px;animation:bump 1.2s infinite}
.splash p{color:var(--muted);text-align:center;margin-top:8px}
.fatal{text-align:center;padding:40px 20px}
.fatal .e{font-size:60px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:70;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.section-t{font-size:13px;color:var(--muted);margin:4px 2px 10px;font-weight:700}
/* ── penalty ── */
.pitch{width:100%;border-radius:18px;padding:16px 10px 70px;background:repeating-linear-gradient(180deg,#15803d 0 26px,#166534 26px 52px);position:relative;direction:ltr}
.goal{position:relative;height:120px;border:5px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;display:grid;grid-template-columns:repeat(3,1fr);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px)}
.zone{display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.65)}
.keeper{position:absolute;bottom:0;left:50%;font-size:46px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.4,.5,1)}
.pball{position:absolute;bottom:14px;left:50%;font-size:30px;transform:translateX(-50%);transition:all .5s ease-out}
/* ── roulette ── */
.rl-ball{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;box-shadow:inset 0 -8px 20px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.5);border:6px solid #3b2410;direction:ltr}
.rl-ball.red{background:radial-gradient(circle at 35% 30%,#ff7a93,#be123c)}.rl-ball.black{background:radial-gradient(circle at 35% 30%,#555,#111)}.rl-ball.green{background:radial-gradient(circle at 35% 30%,#4ade80,#047857)}
.rl-hist{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;justify-content:center;direction:ltr}
.rl-hist span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.rl-hist .red{background:#be123c}.rl-hist .black{background:#222}.rl-hist .green{background:#047857}
/* ── quiz ── */
.qcard{padding:16px;border-radius:18px;background:linear-gradient(180deg,#1d1d2e,#131320);border:1px solid var(--line);margin-bottom:10px}
.qcard h4{margin:0 0 12px;font-size:16px;line-height:1.9}
.qopt{display:block;width:100%;text-align:right;padding:13px 14px;margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:14px}
.qopt.on{border-color:var(--gold);background:rgba(245,196,81,.14)}
.qopt.right{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.14)}
.qopt.wrong{border-color:rgba(225,29,72,.6);background:rgba(225,29,72,.12)}
.qlast{font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:10px;line-height:1.9}
/* ── othello ── */
.oth{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:8px;background:#0f3d24;border-radius:16px;border:6px solid #3b2410;direction:ltr;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.ocell{aspect-ratio:1;background:#15803d;border-radius:5px;display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ocell.last{box-shadow:inset 0 0 0 2px var(--gold)}
.odisc{width:84%;height:84%;border-radius:50%;box-shadow:0 3px 6px rgba(0,0,0,.45)}
.odisc.b{background:radial-gradient(circle at 35% 30%,#5b5b5b,#000 70%)}
.odisc.w{background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 70%)}
.odisc.flip{animation:pop .4s}
.ohint{width:30%;height:30%;border-radius:50%;background:rgba(245,196,81,.75);animation:bump 1.4s infinite}
</style>
</head>
<body>
<div class="splash" id="splash"><div><div class="logo">🎲</div><p>قمارخانه زر<br><small>در حال اتصال...</small></p></div></div>

<div id="app">
  <header class="topbar">
    <div class="who">
      <div class="avatar" id="me-avatar">؟</div>
      <div><div class="who-name" id="me-name">...</div><span class="who-lvl" id="me-lvl">لول ۱</span></div>
    </div>
    <div class="bal" id="bal"><span class="coin"></span><span id="bal-v">0</span></div>
  </header>

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="hero">
      <div class="suits">♠♥♣♦</div>
      <h1>به قمارخانه زر خوش اومدی</h1>
      <p>بازی‌های سریع تک‌نفره یا رقابت زنده با حریف واقعی. همه‌چیز سمت سرور و منصفانه حساب می‌شه.</p>
      <div class="big"><b id="hero-bal">0</b><span>زرکوین</span></div>
    </div>
    <div id="resume-box"></div>
    <div class="tabs">
      <button class="tab active" data-tab="1p">🎯 تک‌نفره</button>
      <button class="tab" data-tab="2p">⚔️ دونفره</button>
    </div>
    <div class="grid" id="game-grid"></div>
  </section>

  <!-- SOLO -->
  <section class="screen" id="screen-solo">
    <div class="subhead"><button class="iconbtn" data-nav="home">→</button><h2 id="solo-title"></h2></div>
    <div id="solo-body"></div>
  </section>

  <!-- QUEUE -->
  <section class="screen" id="screen-queue">
    <div class="subhead"><button class="iconbtn" id="q-back">→</button><h2>یافتن حریف</h2></div>
    <div class="radar"><div class="c"><div><b id="q-count">60</b><small>ثانیه</small></div></div></div>
    <div class="qinfo"><h3 id="q-title"></h3><p id="q-desc"></p></div>
    <button class="btn btn-ghost" id="q-cancel">❌ لغو و برگشت پول</button>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game">
    <div class="ghead"><h2 id="g-title"></h2><div class="potpill">💰 <span id="g-pot">0</span></div></div>
    <div class="vs">
      <div class="pcard" id="g-me"><div class="avatar" id="g-me-av"></div><div style="min-width:0"><b id="g-me-name"></b><small>تو</small></div></div>
      <div class="vs-mid">VS</div>
      <div class="pcard oppc" id="g-opp"><div class="avatar" id="g-opp-av"></div><div style="min-width:0"><b id="g-opp-name"></b><small>حریف</small></div></div>
    </div>
    <div class="timer" id="g-timer"><i id="g-timer-bar" style="width:100%"></i></div>
    <div class="gstatus" id="g-status"></div>
    <div id="g-board"></div>
    <div id="g-actions" class="actions"></div>
    <button class="leave" id="g-leave">🏳️ تسلیم و ترک بازی</button>
  </section>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════ پایه ════════════ */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const qsp = new URLSearchParams(location.search);
const hsp = new URLSearchParams(location.hash.replace(/^#/, ''));
const AUTH = { initData: (tg && tg.initData) || '', token: qsp.get('token') || hsp.get('token') || '' };
try { if (AUTH.token) sessionStorage.setItem('zar_token', AUTH.token); else AUTH.token = sessionStorage.getItem('zar_token') || ''; } catch (e) {}

const S = {
  me: null, games: {}, list: [], wheel: [], tab: '1p', screen: 'home', bet: {},
  solo: null, soloKey: null, busy: false,
  queue: null, queueEnd: 0, gameId: null, game: null, lastGameKey: '', deadlineAt: 0, turnTimeout: 45,
  xp: { min: 15, max: 2500, divisor: 10000 },
  resultShown: null, acting: false, authFailed: false, timers: {}
};
const GRAD = {
  wheel: ['#f59e0b', '#9a3412'], crash: ['#818cf8', '#312e81'], mines: ['#10b981', '#064e3b'], hilo: ['#ec4899', '#831843'],
  coin: ['#eab308', '#713f12'], holdem: ['#e11d48', '#4c0519'], hokm: ['#a855f7', '#3b0764'], blackjack: ['#0ea5e9', '#0c4a6e'],
  connect4: ['#ef4444', '#1e3a8a'], rps: ['#fb923c', '#7c2d12'], ttt: ['#2dd4bf', '#134e4a'],
  card: ['#f43f5e', '#1e1b4b'], roulette: ['#16a34a', '#14532d'], penalty: ['#22c55e', '#166534'], quiz: ['#6366f1', '#1e1b4b'],
  othello: ['#475569', '#0f172a']
};
const RANK = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣' };
const SUIT_FA = { S: 'پیک', H: 'دل', D: 'خشت', C: 'گشنیز' };
const RPS_E = { rock: '✊', paper: '✋', scissors: '✌️' };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('fa-IR');
const fmtPlain = n => Number(n || 0).toLocaleString('en-US');
const toEn = s => String(s || '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const parseNum = s => { const v = parseInt(toEn(s).replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; };
const short = n => n >= 1e6 ? (n / 1e6).toLocaleString('fa-IR', { maximumFractionDigits: 1 }) + 'M' : n >= 1e3 ? (n / 1e3).toLocaleString('fa-IR', { maximumFractionDigits: 1 }) + 'K' : fmt(n);
const xpFor = bet => Math.max(S.xp.min, Math.min(S.xp.max, Math.floor((Number(bet) || 0) / S.xp.divisor)));
const initial = name => (String(name || '?').trim()[0] || '?').toUpperCase();
function haptic(type) { try { if (!tg || !tg.HapticFeedback) return; if (type === 'ok' || type === 'err' || type === 'warn') tg.HapticFeedback.notificationOccurred(type === 'ok' ? 'success' : type === 'err' ? 'error' : 'warning'); else tg.HapticFeedback.impactOccurred(type || 'light'); } catch (e) {} }

/* ════════════ API ════════════ */
async function api(path, body, opts) {
  opts = opts || {};
  if (S.authFailed) { const e = new Error('auth'); e.auth = true; throw e; }
  let res;
  try {
    res = await fetch('/api/' + path, {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': AUTH.initData, 'X-Browser-Token': AUTH.token },
      body: JSON.stringify(body || {})
    });
  } catch (e) { const er = new Error('اتصال به سرور برقرار نشد'); er.network = true; throw er; }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { S.authFailed = true; stopAllTimers(); showAuthError(); const er = new Error('auth'); er.auth = true; throw er; }
  if (!data) throw new Error('پاسخ نامعتبر از سرور');
  if (data.balance !== undefined && !opts.deferBalance) setBalance(data.balance);
  if (!data.ok) { const er = new Error(data.error || 'خطا'); er.data = data; throw er; }
  return data;
}

/* ════════════ UI helpers ════════════ */
let toastT = null;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
  if (kind === 'err') haptic('err');
}
function errToast(e) { if (e && e.auth) return; toast((e && e.message) || 'خطا', 'err'); }
let balShown = 0;
function setBalance(v) {
  v = Number(v) || 0;
  if (S.me) S.me.balance = v;
  const el = $('#bal-v'), hero = $('#hero-bal');
  const from = balShown, to = v, t0 = performance.now(), dur = 600;
  if (from !== to) { $('#bal').classList.remove('bump'); void $('#bal').offsetWidth; $('#bal').classList.add('bump'); }
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), val = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = fmt(val); hero.textContent = fmt(val);
    if (k < 1) requestAnimationFrame(step);
  };
  balShown = to; requestAnimationFrame(step);
}
function confetti() {
  const colors = ['#f5c451', '#e11d48', '#10b981', '#38bdf8', '#fff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = (Math.random() * .3) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}
function openBackdrop(onClose) { const b = $('#backdrop'); b.classList.add('show'); b.onclick = onClose || null; }
function closeBackdrop() { $('#backdrop').classList.remove('show'); $('#backdrop').onclick = null; }
function modal(html, onBackdrop) {
  $('#modal-box').innerHTML = html; $('#modal').classList.add('show'); openBackdrop(onBackdrop);
}
function closeModal() { $('#modal').classList.remove('show'); if (!$('#sheet').classList.contains('show')) closeBackdrop(); }
function confirmBox(title, text, okLabel) {
  return new Promise(resolve => {
    modal(`<div class="modal-emoji">⚠️</div><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="row2"><button class="btn btn-ghost" id="cf-no">انصراف</button><button class="btn btn-red" id="cf-yes">${esc(okLabel || 'تأیید')}</button></div>`,
      () => { closeModal(); resolve(false); });
    $('#cf-no').onclick = () => { closeModal(); resolve(false); };
    $('#cf-yes').onclick = () => { closeModal(); resolve(true); };
  });
}
async function botLinkBtn() {
  try {
    const r = await fetch('/api/config'); const d = await r.json();
    if (d.bot_username) return `<a class="btn btn-gold" style="display:block;text-align:center;text-decoration:none;margin-top:16px" href="https://t.me/${d.bot_username}?start=webapp" target="_blank">🔗 دریافت لینک ورود به کازینو</a>`;
  } catch (e) {}
  return '';
}
async function showAuthError() {
  hideSplash();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#screen-home').classList.add('active');
  const btn = await botLinkBtn();
  $('#screen-home').innerHTML = `<div class="fatal"><div class="e">🔒</div><h3>احراز هویت ناموفق</h3>
    <p style="color:var(--muted);line-height:2">به نظر می‌رسد مینی‌اپ خارج از تلگرام یا با یک پروکسی باز شده است.<br>
    برای ورود، یک <b>لینک شخصی</b> از ربات بگیر و روی آن بزن:</p>${btn}
    <p class="hint" style="margin-top:12px">یا مینی‌اپ را از دکمه‌ی «🎰 کازینو» داخل ربات باز کن.</p></div>`;
}

function hideSplash() { const s = $('#splash'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 450); } }
function cardHtml(c, cls, attrs) {
  cls = cls || ''; attrs = attrs || '';
  if (!c) return `<div class="card back ${cls}" ${attrs}></div>`;
  const red = c.s === 'H' || c.s === 'D', r = RANK[c.r] || c.r;
  return `<div class="card ${red ? 'red' : ''} ${cls}" ${attrs}><span class="cr">${r}</span><span class="cs">${SUIT[c.s]}</span><span class="cc">${SUIT[c.s]}</span></div>`;
}

/* ════════════ ناوبری ════════════ */
function stopAllTimers() { Object.keys(S.timers).forEach(k => { clearInterval(S.timers[k]); clearTimeout(S.timers[k]); delete S.timers[k]; }); }
function stopTimer(k) { if (S.timers[k]) { clearInterval(S.timers[k]); clearTimeout(S.timers[k]); delete S.timers[k]; } }
function show(screen) {
  S.screen = screen;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + screen));
  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { try { screen === 'home' ? tg.BackButton.hide() : tg.BackButton.show(); } catch (e) {} }
  if (screen !== 'queue') { stopTimer('qpoll'); stopTimer('qtick'); }
  if (screen !== 'game') { stopTimer('gpoll'); stopTimer('gtick'); }
  if (screen === 'home') { renderHome(); refreshMe(); }
}
async function handleBack() {
  if ($('#modal').classList.contains('show')) { closeModal(); return; }
  if ($('#sheet').classList.contains('show')) { closeSheet(); return; }
  if (S.screen === 'solo') { if (S.busy) return; show('home'); }
  else if (S.screen === 'queue') cancelQueue();
  else if (S.screen === 'game') leaveGame();
}

/* ════════════ خانه ════════════ */
function applyMe(d) {
  S.me = d.user; S.list = d.games || []; S.games = {}; S.list.forEach(g => S.games[g.key] = g);
  S.wheel = d.wheel_segments || []; S.solo = d.solo || null; S.turnTimeout = d.turn_timeout || 45;
  S.me.commission = (typeof d.commission === 'number') ? d.commission : 0.05;
  if (d.xp) S.xp = d.xp;
  $('#me-name').textContent = S.me.name; $('#me-avatar').textContent = initial(S.me.name);
  $('#me-lvl').textContent = 'لول ' + fmt(S.me.level || 1);
  setBalance(S.me.balance);
}
async function refreshMe() {
  try { const d = await api('me'); applyMe(d); if (S.screen === 'home') renderHome(); } catch (e) {}
}
function renderHome() {
  if (!S.me) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === S.tab));
  const box = $('#resume-box');
  if (S.solo && S.games[S.solo.type]) {
    const g = S.games[S.solo.type];

/* ════════════ کنترل شرط ════════════ */
function chipsFor(g) {
  const out = [];
  // بازه‌ی بزرگ (مثل ۱۰ هزار تا ۳۰ میلیون) → پله‌های ده‌برابری؛ بازه‌ی کوچک → پله‌های ریزتر
  const mults = g.max_bet / g.min_bet >= 100 ? [1, 10, 100, 1000, 10000] : [1, 1.5, 2, 3, 5, 10, 50];
  mults.forEach(m => { const v = Math.round(g.min_bet * m); if (v <= g.max_bet && out.length < 5 && !out.includes(v)) out.push(v); });
  if (!out.includes(g.max_bet)) out.push(g.max_bet);
  return out;
}
function betControl(key, id) {
  const g = S.games[key]; const v = Math.max(g.min_bet, S.bet[key] || g.min_bet);
  return `<div class="panel"><span class="label">💰 مبلغ شرط</span>
    <div class="betrow"><button data-bk="${id}" data-op="half">½</button><input id="${id}" inputmode="numeric" autocomplete="off" value="${fmtPlain(v)}"><button data-bk="${id}" data-op="double">2×</button></div>
    <div class="chips">${chipsFor(g).map(c => `<button class="chip" data-bk="${id}" data-op="set" data-v="${c}">${short(c)}</button>`).join('')}
    <button class="chip" data-bk="${id}" data-op="max">حداکثر</button></div>
    <div class="hint">حداقل ${fmt(g.min_bet)} — حداکثر ${fmt(g.max_bet)}</div>
    <div class="hint" id="${id}-xp" style="color:var(--gold)"></div></div>`;
}
function bindBet(key, id) {
  const input = document.getElementById(id); if (!input) return;
  const g = S.games[key];
  const clamp = v => Math.max(g.min_bet, Math.min(g.max_bet, v));
  const xpEl = document.getElementById(id + '-xp');
  const updXp = () => { if (xpEl) xpEl.textContent = '⭐ برد = ' + fmt(xpFor(parseNum(input.value) || g.min_bet)) + ' XP'; };
  input.addEventListener('blur', () => { const v = clamp(parseNum(input.value) || g.min_bet); input.value = fmtPlain(v); S.bet[key] = v; updXp(); });
  input.addEventListener('input', () => { S.bet[key] = parseNum(input.value); updXp(); });
  input.parentElement.parentElement.addEventListener('click', e => {
    const b = e.target.closest('[data-bk]'); if (!b || b.dataset.bk !== id) return;
    let v = parseNum(input.value) || g.min_bet;
    if (b.dataset.op === 'half') v = Math.floor(v / 2);
    else if (b.dataset.op === 'double') v = v * 2;
    else if (b.dataset.op === 'set') v = Number(b.dataset.v);
    else if (b.dataset.op === 'max') v = Math.min(g.max_bet, (S.me && S.me.balance) || g.min_bet);
    v = clamp(v); input.value = fmtPlain(v); S.bet[key] = v; haptic(); updXp();
  });
  updXp();
}
function readBet(key, id) {
  const g = S.games[key], el = document.getElementById(id);
  const v = parseNum(el ? el.value : S.bet[key]);
  if (!v || v < g.min_bet) { toast('حداقل شرط ' + fmt(g.min_bet) + ' است', 'err'); return 0; }
  if (v > g.max_bet) { toast('حداکثر شرط ' + fmt(g.max_bet) + ' است', 'err'); return 0; }
  if (S.me && v > S.me.balance) { toast('موجودی کافی نیست', 'err'); return 0; }
  S.bet[key] = v; return v;
}

function openSolo(key, session) {

}
function soloResult(win, bet) {
  const profit = win - bet;
  if (win > bet) { haptic('ok'); if (win >= bet * 3) confetti(); return `<div class="result-pill win">🎉 بردی! +${fmt(win)}</div>`; }
  if (win > 0) return `<div class="result-pill lose">برگشت ${fmt(win)} (${fmt(profit)})</div>`;
  haptic('err'); return `<div class="result-pill lose">💀 باختی −${fmt(bet)}</div>`;
}

/* ── چرخ شانس ── */
let wheelRot = 0;
const WCOL = m => m >= 5 ? ['#f5c451', '#2a1800'] : m >= 2 ? ['#ea580c', '#fff'] : m >= 1.5 ? ['#e11d48', '#fff'] : m > 0 ? ['#475569', '#fff'] : ['#16161f', '#6b6b80'];
function wheelSvg() {
  const n = S.wheel.length, seg = 360 / n, R = 100, cx = 100, cy = 100;
  const pt = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let s = `<svg viewBox="0 0 200 200" id="wheel-svg" style="transform:rotate(${wheelRot}deg)"><circle cx="100" cy="100" r="100" fill="#3b2410"/>`;
  S.wheel.forEach((m, i) => {
    const a0 = i * seg, a1 = a0 + seg, [x0, y0] = pt(a0, R - 4), [x1, y1] = pt(a1, R - 4), [tx, ty] = pt(a0 + seg / 2, 68), c = WCOL(m);
    s += `<path d="M100,100 L${x0},${y0} A${R - 4},${R - 4} 0 0,1 ${x1},${y1} Z" fill="${c[0]}" stroke="#0b0b12" stroke-width="1.2"/>`;
    s += `<text x="${tx}" y="${ty}" fill="${c[1]}" font-size="12" font-weight="900" text-anchor="middle" dominant-baseline="middle" transform="rotate(${a0 + seg / 2},${tx},${ty})" font-family="Vazirmatn,sans-serif">${m ? '×' + m : '✕'}</text>`;
  });
  for (let i = 0; i < n; i++) { const [x, y] = pt(i * seg, 97); s += `<circle cx="${x}" cy="${y}" r="2.2" fill="#fde68a"/>`; }
  return s + '</svg>';
}
function renderWheel() {
  $('#solo-body').innerHTML = `<div class="stage"><div class="wheel-wrap"><div class="wheel-pointer"></div>${wheelSvg()}<div class="wheel-hub">زر</div></div><div id="w-res"></div></div>
    ${betControl('wheel', 'bet-solo')}<button class="btn btn-gold" id="w-spin">🎡 بچرخون!</button>`;

async function spinWheel() {
  if (S.busy) return; const bet = readBet('wheel', 'bet-solo'); if (!bet) return;

async function playCrash() {
  if (S.busy) return; const bet = readBet('crash', 'bet-solo'); if (!bet) return;
  const target = S.bet.crashTarget || 2;

  try {
    const d = await api('solo/crash', { bet, target }, { deferBalance: true });
    rk.classList.add('fly'); haptic('medium');
    const T = Math.min(4200, 1100 + Math.log(Math.max(1, d.crash)) * 900), t0 = performance.now();
    await new Promise(res => {
      const f = now => {
        const k = Math.min(1, (now - t0) / T), m = Math.pow(d.crash, k);
        num.textContent = m.toFixed(2) + '×';
        if (m >= target) num.classList.add('passed');
        rk.style.transform = `translateY(${-k * 40}px) rotate(${-k * 12}deg)`;
        k < 1 ? requestAnimationFrame(f) : res();
      };
      requestAnimationFrame(f);
    });
    rk.classList.remove('fly'); rk.textContent = '💥'; num.textContent = d.crash.toFixed(2) + '×';
    if (!d.won) num.classList.add('dead');

async function playCardGame(pick) {

  ['dozen1', '۱–۱۲', 3], ['dozen2', '۱۳–۲۴', 3], ['dozen3', '۲۵–۳۶', 3], ['number', '🎯 عدد', 36]];

/* ════════════ شیت شرط دونفره ════════════ */

    <button class="btn btn-red" id="sh-go">⚔️ یافتن حریف</button>`;

function closeSheet() {

  if (tg && tg.BackButton && S.screen === 'home') try { tg.BackButton.hide(); } catch (e) {}
}
async function joinMatch(key) {
  const bet = readBet(key, 'bet-sheet'); if (!bet) return;
  const btn = $('#sh-go'); btn.disabled = true; haptic('medium');
  try {
    const d = await api('match/join', { game: key, bet });
    closeSheet();
    if (d.status === 'matched') openGame(d.game_id); else openQueue(d.queue);
  } catch (e) {
    if (e.data && e.data.code === 'in_game') { closeSheet(); openGame(e.data.game_id); }

    else errToast(e);

/* ════════════ صف ════════════ */
function openQueue(q) {
  if (!q) return;
  S.queue = q; S.queueEnd = Date.now() + (q.remaining || 60) * 1000;
  $('#q-title').textContent = (q.emoji || '') + ' ' + (q.title || '');
  $('#q-desc').innerHTML = `شرط: <b style="color:var(--gold)">${fmt(q.bet)}</b> زرکوین<br>در حال جستجوی حریف با همین مبلغ...`;
  show('queue');
  const tick = () => { const left = Math.max(0, Math.ceil((S.queueEnd - Date.now()) / 1000)); $('#q-count').textContent = fmt(left); };
  tick(); S.timers.qtick = setInterval(tick, 500);
  let inflight = false;
  S.timers.qpoll = setInterval(async () => {
    if (inflight) return; inflight = true;
    try {
      const d = await api('match/status');
      if (d.status === 'matched') { haptic('ok'); toast('🎯 حریف پیدا شد!', 'ok'); openGame(d.game_id); }
      else if (d.status === 'timeout') { toast('⌛ حریفی پیدا نشد — ' + fmt(d.refunded) + ' برگشت داده شد'); show('home'); }
      else if (d.status === 'idle') show('home');
      else if (d.queue) S.queueEnd = Date.now() + d.queue.remaining * 1000;
    } catch (e) { if (!e.network) errToast(e); }
    inflight = false;
  }, 1500);
}
async function cancelQueue() {
  const b = $('#q-cancel'); b.disabled = true;
  try {
    const d = await api('match/cancel');
    if (d.status === 'matched') openGame(d.game_id);
    else { if (d.refunded) toast('↩️ ' + fmt(d.refunded) + ' برگشت داده شد', 'ok'); show('home'); }
  } catch (e) { errToast(e); }
  b.disabled = false;
}
$('#q-cancel').onclick = cancelQueue;
$('#q-back').onclick = cancelQueue;

/* ════════════ بازی دونفره ════════════ */
function openGame(gid) {
  S.gameId = gid; S.game = null; S.lastGameKey = ''; S.resultShown = null;
  $('#g-board').innerHTML = '<div class="stage"><div class="splash-in">⏳</div></div>'; $('#g-actions').innerHTML = '';
  show('game');
  pollGame();
  let inflight = false;
  S.timers.gpoll = setInterval(async () => { if (inflight || S.acting) return; inflight = true; await pollGame(); inflight = false; }, 1200);
  S.timers.gtick = setInterval(tickTimer, 250);
}
async function pollGame() {
  try {
    const d = await api('game/state', { game_id: S.gameId });
    if (!d.game) { stopTimer('gpoll'); toast('بازی پیدا نشد یا تمام شده'); show('home'); return; }
    renderGame(d.game);
  } catch (e) { if (!e.network) errToast(e); }
}
function tickTimer() {
  const g = S.game; if (!g) return;
  const bar = $('#g-timer-bar'), wrap = $('#g-timer');
  if (g.finished) { bar.style.width = '0%'; return; }
  const left = Math.max(0, S.deadlineAt - Date.now()), pct = Math.min(100, left / ((g.turn_timeout || S.turnTimeout) * 1000) * 100);
  bar.style.width = pct + '%'; wrap.classList.toggle('low', left < 10000);
  const t = $('#g-status .t'); if (t) t.textContent = '(' + fmt(Math.ceil(left / 1000)) + ' ث)';
}
function statusText(g) {
  if (g.finished) return esc(g.reason);
  const s = g.state || {};
  if (g.game_key === 'rps') return s.my_pick ? (s.opp_picked ? '...' : '⏳ منتظر انتخاب حریف') : '🟢 انتخاب کن! (دست ' + fmt(s.round) + ')';
  if (g.game_key === 'quiz') return s.my_answer != null ? '⏳ منتظر جواب حریف' : '🟢 جواب بده!';
  if (g.game_key === 'blackjack') return s.my_done ? '⏳ منتظر حریف' : '🟢 کارت بگیر یا بایست';
  if (g.game_key === 'hokm' && s.phase === 'trump') return s.i_am_hakem ? '👑 تو حاکمی — حکم را انتخاب کن' : '⏳ حریف حاکم است و حکم را انتخاب می‌کند';
  return g.your_turn ? '🟢 نوبت توئه' : '⏳ نوبت حریف';
}
function renderGame(g) {
  S.game = g;
  S.deadlineAt = Date.now() + (g.deadline_in || 0) * 1000;
  const key = JSON.stringify(Object.assign({}, g, { deadline_in: 0 }));
  if (key === S.lastGameKey) return;
  const prev = S.game && S.lastGameKey ? JSON.parse(S.lastGameKey) : null;
  S.lastGameKey = key;
  $('#g-title').textContent = g.emoji + ' ' + g.title;
  $('#g-pot').textContent = fmt(g.pot);
  $('#g-me-name').textContent = g.me.name; $('#g-me-av').textContent = initial(g.me.name);
  $('#g-opp-name').textContent = g.opp.name; $('#g-opp-av').textContent = initial(g.opp.name);
  $('#g-me').classList.toggle('turn', !g.finished && g.your_turn);
  $('#g-opp').classList.toggle('turn', !g.finished && g.opp_turn);
  $('#g-status').innerHTML = statusText(g) + (g.finished ? '' : '<span class="t"></span>');
  $('#g-leave').classList.toggle('hidden', g.finished);
  if (prev && !prev.your_turn && g.your_turn && !g.finished) haptic('medium');
  (RENDER[g.game_key] || (() => {}))(g);
  tickTimer();
  if (g.finished && S.resultShown !== g.game_id) { S.resultShown = g.game_id; stopTimer('gpoll'); setTimeout(() => showResult(g), 900); }
}
function showResult(g) {
  if (S.screen !== 'game') return;
  const r = g.result;
  const em = r === 'win' ? '🏆' : r === 'lose' ? '💀' : '🤝';
  const title = r === 'win' ? 'بردی!' : r === 'lose' ? 'باختی' : 'مساوی';
  const amt = r === 'win' ? `<div class="modal-amt" style="color:#34d399">+${fmt(g.payout)}</div>` : r === 'lose' ? `<div class="modal-amt" style="color:#fb7185">−${fmt(g.bet)}</div>` : `<div class="modal-amt" style="color:var(--muted)">↩️ ${fmt(g.bet)}</div>`;
  if (r === 'win') { confetti(); haptic('ok'); } else if (r === 'lose') haptic('err');
  modal(`<div class="modal-emoji">${em}</div><h3>${title}</h3><p>${esc(g.reason)}</p>${amt}
    <div class="row2"><button class="btn btn-ghost" id="rs-home">🏠 خانه</button><button class="btn btn-gold" id="rs-again">🔁 دوباره</button></div>
    <button class="btn btn-ghost" id="rs-view" style="margin-top:8px;padding:10px;font-size:13px">👀 دیدن صفحه بازی</button>`, () => closeModal());
  $('#rs-home').onclick = () => { closeModal(); show('home'); };
  $('#rs-again').onclick = () => { closeModal(); S.bet[g.game_key] = g.bet; show('home'); openSheet(g.game_key); };
  $('#rs-view').onclick = () => { closeModal(); $('#g-actions').innerHTML = '<button class="btn btn-gold" data-nav="home">🏠 بازگشت به خانه</button>'; };
}
async function leaveGame() {
  const g = S.game;
  if (!g || g.finished) { show('home'); return; }
  const ok = await confirmBox('ترک بازی؟', 'اگر بازی را ترک کنی، حریف برنده می‌شود و شرطت را از دست می‌دهی.', 'تسلیم');
  if (!ok) return;

}
$('#g-leave').onclick = leaveGame;
async function sendAction(payload) {
  if (S.acting || !S.game || S.game.finished) return;
  S.acting = true; haptic();
  try { const d = await api('game/action', Object.assign({ game_id: S.gameId }, payload)); renderGame(d.game); }
  catch (e) { errToast(e); if (e.data && e.data.game) renderGame(e.data.game); }
  S.acting = false;
}
$('#screen-game').addEventListener('input', e => { if (e.target.id === 'raise-amt') S.raiseVal = parseNum(e.target.value); });
$('#screen-game').addEventListener('click', e => {
  const ra = e.target.closest('[data-ra]');
  if (ra && S.raiseBounds) {
    const B = S.raiseBounds, pot = B.pot || 0;
    let v = { min: B.min, half: Math.floor(pot / 2), pot: pot, double: pot * 2, max: B.max }[ra.dataset.ra] || B.min;
    v = Math.max(B.min, Math.min(B.max, v)); S.raiseVal = v;
    const inp = $('#raise-amt'); if (inp) inp.value = fmtPlain(v); haptic(); return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.classList.contains('unplayable')) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'poker' && v === 'raise') {
    const amt = parseNum(($('#raise-amt') || {}).value);
    if (!amt) { toast('مبلغ رِیز را وارد کن', 'err'); return; }
    sendAction({ action: 'raise', amount: amt }); S.raiseVal = 0; return;
  }
  const map = { cell: { cell: Number(v) }, col: { col: Number(v) }, pick: { pick: v }, bj: { action: v }, trump: { suit: v }, card: { card: v }, poker: { action: v }, answer: { answer: Number(v) } };
  if (map[a]) sendAction(map[a]);
});

/* ── رندر هر بازی ── */
const RENDER = {
  ttt(g) {
    const s = g.state, line = new Set(s.line || []), can = g.your_turn && !g.finished;
    $('#g-board').innerHTML = `<div class="tttg">${s.board.map((m, i) => `<button class="tttc ${m === 1 ? 'x' : m === 2 ? 'o' : ''} ${line.has(i) ? 'win' : ''}" data-act="cell" data-v="${i}" ${can && !m ? '' : 'disabled'}>${m === 1 ? '✕' : m === 2 ? '◯' : ''}</button>`).join('')}</div>
      <p class="hint" style="text-align:center;margin-top:12px">علامت تو: <b style="font-size:18px;color:${s.my_mark === 1 ? '#fb7185' : 'var(--gold)'}">${s.my_mark === 1 ? '✕' : '◯'}</b></p>`;
    $('#g-actions').innerHTML = '';
  },
  connect4(g) {
    const s = g.state, line = new Set(s.line || []), can = g.your_turn && !g.finished;
    let cols = '';
    for (let c = 0; c < s.cols; c++) {
      const full = s.board[c] !== 0;
      let cells = '';
      for (let r = 0; r < s.rows; r++) { const i = r * s.cols + c, v = s.board[i]; cells += `<div class="c4cell ${v ? 'p' + v : ''} ${line.has(i) ? 'win' : ''} ${s.last === i ? 'last' : ''}"></div>`; }
      cols += `<div class="c4col ${can && !full ? 'can' : ''}" ${can && !full ? `data-act="col" data-v="${c}"` : ''}>${cells}</div>`;
    }
    $('#g-board').innerHTML = `<div class="c4">${cols}</div><p class="hint" style="text-align:center;margin-top:12px">مهره تو: <span class="c4cell p${s.my_disc}" style="display:inline-block;width:16px;height:16px;vertical-align:middle"></span> — روی ستون بزن</p>`;
    $('#g-actions').innerHTML = '';
  },
  rps(g) {
    const s = g.state, can = !g.finished && !s.my_pick;
    const hist = s.history.slice().reverse().map((h, i) => `<div class="hrow" style="${i === 0 ? 'border:1px solid rgba(245,196,81,.3)' : ''}"><span>${RPS_E[h.me]}</span><span class="r ${h.result}">${h.result === 'win' ? 'بردی' : h.result === 'lose' ? 'باختی' : 'مساوی'}</span><span>${RPS_E[h.opp]}</span></div>`).join('');
    $('#g-board').innerHTML = `<div class="score"><div>${fmt(s.score_me)}<small>تو</small></div><span style="color:var(--muted);font-size:20px">:</span><div>${fmt(s.score_opp)}<small>حریف</small></div></div>
      <div class="rpsb">${['rock', 'paper', 'scissors'].map(p => `<button data-act="pick" data-v="${p}" class="${s.my_pick === p ? 'on' : ''}" ${can ? '' : 'disabled'}>${RPS_E[p]}</button>`).join('')}</div>
      <p class="hint" style="text-align:center">${s.opp_picked && !g.finished ? '✅ حریف انتخابش را کرده' : ''}</p>
      ${hist ? `<div class="hist"><div class="hrow" style="font-size:12px;color:var(--muted);background:none"><span>تو</span><span>نتیجه</span><span>حریف</span></div>${hist}</div>` : ''}`;
    $('#g-actions').innerHTML = '';
  },
  blackjack(g) {
    const s = g.state, can = !g.finished && !s.my_done;
    $('#g-board').innerHTML = `<div class="felt">
      <div class="lbl">${esc(g.opp.name)} ${s.opp_done && !g.finished ? '✅' : ''}</div>
      <div class="cards">${s.opp_cards.map(c => cardHtml(c, 'deal')).join('')}</div>
      <div class="val">${s.opp_value != null ? 'امتیاز: ' + fmt(s.opp_value) : 'امتیاز: ؟'}</div>
      <div class="pot">💰 ${fmt(g.pot)}</div>
      <div class="cards">${s.my_cards.map(c => cardHtml(c, 'deal')).join('')}</div>
      <div class="val" style="${s.my_value > 21 ? 'color:#fb7185' : s.my_value === 21 ? 'color:#34d399' : ''}">امتیاز تو: ${fmt(s.my_value)} ${s.my_value > 21 ? '— سوختی!' : ''}</div></div>`;
    $('#g-actions').innerHTML = g.finished ? '' : `<div class="row2"><button class="btn btn-gold" data-act="bj" data-v="hit" ${can ? '' : 'disabled'}>🃏 کارت بده</button><button class="btn btn-red" data-act="bj" data-v="stand" ${can ? '' : 'disabled'}>✋ بسه</button></div>`;
  },
  hokm(g) {
    const s = g.state;
    if (s.phase === 'trump') {
      const can = s.i_am_hakem && g.your_turn && !g.finished;
      $('#g-board').innerHTML = `<div class="stage" style="min-height:160px"><div style="font-size:40px">👑</div><p style="margin:6px 0 0;color:var(--muted);font-size:13px">${s.i_am_hakem ? 'با دیدن ۵ کارت اولت حکم را انتخاب کن' : 'حریف حاکم است...'}</p></div>
        <div class="hand">${s.my_hand.map(c => cardHtml(c, 'deal')).join('')}</div>
        ${can ? `<div class="suitbtns">${['S', 'H', 'D', 'C'].map(x => `<button data-act="trump" data-v="${x}" class="${x === 'H' || x === 'D' ? 'red' : ''}">${SUIT[x]}</button>`).join('')}</div>` : ''}`;
      $('#g-actions').innerHTML = '';
      return;
    }
    const tr = s.trump, trRed = tr === 'H' || tr === 'D';
    let mid = '';
    if (s.table.length) mid = s.table.map(t => `<div class="played">${cardHtml(t.card, 'deal')}<span>${t.mine ? 'تو' : 'حریف'}</span></div>`).join('');
    else if (s.last_trick) mid = `<div style="text-align:center"><div class="cards" style="opacity:.85">${s.last_trick.cards.map(t => `<div class="played">${cardHtml(t.card, 'sm')}<span>${t.mine ? 'تو' : 'حریف'}</span></div>`).join('')}</div><div class="hint">${s.last_trick.i_won ? '✅ دست قبل را بردی' : '❌ دست قبل را حریف برد'}</div></div>`;
    else mid = `<span class="hint">${g.your_turn ? 'اولین کارت را بازی کن' : 'منتظر کارت حریف...'}</span>`;
    $('#g-board').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="trump">حکم: <b style="color:${trRed ? '#fb7185' : '#fff'}">${SUIT[tr]}</b> ${SUIT_FA[tr]}</span>
        <span class="trump">🏆 تو ${fmt(s.tricks_me)} — ${fmt(s.tricks_opp)} حریف <small style="color:var(--muted)">(۷)</small></span></div>
      <div class="hand opp-hand" style="padding-top:4px">${Array.from({ length: Math.min(s.opp_count, 13) }, () => cardHtml(null, 'sm')).join('')}</div>
      <div class="table-mid">${mid}</div>
      <div class="hand">${s.my_hand.map(c => cardHtml(c, c.playable ? 'playable' : (g.your_turn ? 'unplayable' : ''), c.playable ? `data-act="card" data-v="${c.id}"` : '')).join('')}</div>
      ${s.i_am_hakem ? '<p class="hint" style="text-align:center">👑 تو حاکمی</p>' : ''}`;
    $('#g-actions').innerHTML = '';
  },
  holdem(g) {
    const s = g.state, can = g.your_turn && !g.finished;
    const board = [0, 1, 2, 3, 4].map(i => s.board[i] ? cardHtml(s.board[i], 'sm deal') : '<div class="card sm empty"></div>').join('');
    $('#g-board').innerHTML = `<div class="felt">
      <div class="lbl">${esc(g.opp.name)} — گذاشته: ${fmt(s.opp_contrib)}</div>
      <div class="cards">${s.opp_cards.map(c => cardHtml(c, 'sm')).join('')}</div>
      ${s.opp_hand ? `<div class="val">${esc(s.opp_hand)}</div>` : ''}
      <div class="lbl" style="margin-top:10px">${esc(s.street_name)}</div>
      <div class="cards" style="gap:4px">${board}</div>
      <div class="pot">💰 پات: ${fmt(g.pot)}</div>
      <div class="cards">${s.my_cards.map(c => cardHtml(c, 'deal')).join('')}</div>
      <div class="val">دست تو: ${esc(s.my_hand)} — گذاشته: ${fmt(s.my_contrib)}</div></div>
      <div class="log">${s.log.map(esc).join('<br>')}</div>`;
    if (g.finished) { $('#g-actions').innerHTML = ''; return; }
    const mn = s.min_raise || 0, mx = s.max_raise || 0;
    let rv = S.raiseVal || mn; rv = Math.max(mn, Math.min(mx, rv));
    S.raiseBounds = { min: mn, max: mx, pot: g.pot };
    $('#g-actions').innerHTML = `
      ${s.can_raise ? `<div class="panel" style="margin:0"><span class="label">⬆️ مبلغ رِیز (از ${fmt(mn)} تا ${fmt(mx)}) — موجودی تو: ${fmt(s.my_balance)}</span>
        <div class="betrow"><input id="raise-amt" inputmode="numeric" value="${fmtPlain(rv)}" ${can ? '' : 'disabled'}></div>
        <div class="chips"><button class="chip" data-ra="min">حداقل</button><button class="chip" data-ra="half">½ پات</button><button class="chip" data-ra="pot">پات</button><button class="chip" data-ra="double">۲× پات</button><button class="chip" data-ra="max">🔥 آل‌این</button></div></div>` : ''}
      <div class="row3">
      <button class="btn btn-ghost" data-act="poker" data-v="fold" ${can ? '' : 'disabled'}>🏳️ فولد</button>
      ${s.can_check ? `<button class="btn btn-green" data-act="poker" data-v="check" ${can ? '' : 'disabled'}>✔️ چک</button>`
        : `<button class="btn btn-green" data-act="poker" data-v="call" ${can ? '' : 'disabled'} style="font-size:13px">📞 کال ${short(s.call_amount)}</button>`}
      <button class="btn btn-gold" data-act="poker" data-v="raise" ${can && s.can_raise ? '' : 'disabled'} style="font-size:13px">⬆️ رِیز</button></div>`;
  },
  othello(g) {
    const s = g.state, valid = new Set(s.valid || []), can = g.your_turn && !g.finished, flipped = new Set(s.flipped || []);
    const myC = s.my_disc === 1 ? 'b' : 'w', opC = s.my_disc === 1 ? 'w' : 'b';
    let cells = '';
    for (let i = 0; i < 64; i++) {
      const v = s.board[i], ok = can && valid.has(i);
      const disc = v ? `<div class="odisc ${v === 1 ? 'b' : 'w'} ${(flipped.has(i) || s.last === i) ? 'flip' : ''}"></div>` : (ok ? '<div class="ohint"></div>' : '');
      cells += `<button class="ocell ${s.last === i ? 'last' : ''}" ${ok ? `data-act="cell" data-v="${i}"` : 'disabled'} style="opacity:1">${disc}</button>`;
    }
    $('#g-board').innerHTML = `<div class="score"><div><span class="odisc ${myC}" style="display:inline-block;width:22px;height:22px;vertical-align:middle"></span> ${fmt(s.me)}<small>تو</small></div>
        <span style="color:var(--muted);font-size:20px">:</span><div>${fmt(s.opp)} <span class="odisc ${opC}" style="display:inline-block;width:22px;height:22px;vertical-align:middle"></span><small>حریف</small></div></div>
      <div class="oth">${cells}</div>
      <p class="hint" style="text-align:center;margin-top:10px">${s.opp_passed && !g.finished ? '⏭ حریف حرکتی نداشت — دوباره نوبت توئه' : s.i_passed && !g.finished ? '⏭ حرکتی نداشتی — نوبتت سوخت' : 'نقطه‌های طلایی = حرکت‌های مجاز'}</p>`;
    $('#g-actions').innerHTML = '';
  },
  quiz(g) {
    const s = g.state, can = !g.finished && s.my_answer == null && s.question;
    let last = '';
    if (s.last) {
      const ok = s.last.mine === s.last.correct, ook = s.last.opp === s.last.correct;
      last = `<div class="qlast">سوال قبل: ${esc(s.last.q)}<br>✅ جواب: <b style="color:#34d399">${esc(s.last.opts[s.last.correct])}</b><br>
        تو: ${ok ? '✅ درست' : '❌ ' + (s.last.mine != null ? esc(s.last.opts[s.last.mine]) : 'بی‌جواب')} — حریف: ${ook ? '✅ درست' : '❌ اشتباه'}</div>`;
    }
    const q = s.question;
    $('#g-board').innerHTML = `<div class="score"><div>${fmt(s.score_me)}<small>تو</small></div><span style="color:var(--muted);font-size:20px">:</span><div>${fmt(s.score_opp)}<small>حریف</small></div></div>
      ${last}
      ${q ? `<div class="qcard"><div class="hint" style="margin:0 0 6px">${s.sudden ? '⚡ مرگ ناگهانی — ' : ''}سوال ${fmt(s.idx + 1)} از ${fmt(s.total)}</div><h4>${esc(q.q)}</h4>
        ${q.opts.map((o, i) => `<button class="qopt ${s.my_answer === i ? 'on' : ''}" data-act="answer" data-v="${i}" ${can ? '' : 'disabled'}>${esc(o)}</button>`).join('')}</div>
        <p class="hint" style="text-align:center">${s.opp_answered ? '✅ حریف جواب داده' : '⏳ حریف هنوز جواب نداده'}</p>` : ''}`;
    $('#g-actions').innerHTML = '';
  }
};

/* ════════════ شروع ════════════ */
async function boot() {
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#07070c'); tg.setBackgroundColor('#07070c'); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.BackButton.onClick(handleBack); } catch (e) {}
  }
  // بدون احراز هویت: داخل تلگرام (پروکسی/کلاینت دیگر) → صفحه‌ی لینک ورود | با لینک (مرورگر) → رمز پنل مدیریت
  if (!AUTH.initData && !AUTH.token) { tg ? showAuthError() : location.replace('/admin'); return; }
  try {
    const d = await api('me');
    applyMe(d); S.me.commission = d.commission;
    renderHome(); hideSplash();
    if (d.refunded) toast('↩️ ' + fmt(d.refunded) + ' زرکوین از صف قبلی برگشت داده شد', 'ok');
    if (d.game_id) openGame(d.game_id);
    else if (d.queue) openQueue(d.queue);
  } catch (e) {
    if (e.auth) return;
    hideSplash();
    $('#screen-home').innerHTML = `<div class="fatal"><div class="e">📡</div><h3>خطا در اتصال</h3><p style="color:var(--muted)">${esc(e.message)}</p><button class="btn btn-gold" onclick="location.reload()">🔄 تلاش دوباره</button></div>`;
  }
  setInterval(() => { if (S.screen === 'home' && !S.authFailed && document.visibilityState === 'visible') api('balance').catch(() => {}); }, 20000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen === 'game' && S.gameId && !(S.game && S.game.finished)) pollGame(); });
boot();
</script>
</body>
</html>
